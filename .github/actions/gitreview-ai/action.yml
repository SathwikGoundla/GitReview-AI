# GitReview AI — Reusable GitHub Action
#
# This composite action wraps the GitReview AI backend analysis call into
# a single reusable step that any repository can reference.
#
# Usage (in a user's .github/workflows/gitreview.yml):
#
#   uses: SathwikGoundla/GitReview-AI/.github/actions/gitreview-ai@main
#   with:
#     backend-url: ${{ secrets.GITREVIEW_BACKEND_URL }}
#     shared-secret: ${{ secrets.GITREVIEW_SHARED_SECRET }}
#
# The action extracts repository/PR context from the GitHub Actions
# environment automatically — users do not need to pass owner, repo,
# PR number, or commit SHA manually.

name: "GitReview AI — PR Analysis"
description: >
  Analyze a pull request using the GitReview AI backend. Posts a risk
  assessment comment with review guidance, and applies a risk-tier label.

inputs:
  backend-url:
    description: >
      Full URL of the deployed GitReview AI backend
      (e.g. https://your-app.onrender.com). Must NOT include a trailing slash.
    required: true
  shared-secret:
    description: >
      Shared secret matching ACTIONS_SHARED_SECRET configured in the backend
      environment. Generate with: openssl rand -hex 32
    required: true

outputs:
  risk-tier:
    description: "Risk tier assigned to the PR (low, medium, high, critical)"
    value: ${{ steps.analyze.outputs.risk_tier }}
  status:
    description: "Analysis status (completed, degraded, failed)"
    value: ${{ steps.analyze.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Analyze Pull Request
      id: analyze
      shell: bash
      env:
        BACKEND_URL: ${{ inputs.backend-url }}
        SHARED_SECRET: ${{ inputs.shared-secret }}
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # ── Validate required inputs ──────────────────────────────────────────
        if [ -z "$BACKEND_URL" ]; then
          echo "::error::backend-url input is required."
          exit 1
        fi
        if [ -z "$SHARED_SECRET" ]; then
          echo "::error::shared-secret input is required."
          exit 1
        fi
        if [ -z "$PR_NUMBER" ]; then
          echo "::error::This action must be triggered by a pull_request event."
          exit 1
        fi
        if [ -z "$COMMIT_SHA" ]; then
          echo "::error::Could not determine pull request head SHA."
          exit 1
        fi

        echo "Requesting GitReview AI analysis for ${OWNER}/${REPO_NAME} PR #${PR_NUMBER} @ ${COMMIT_SHA:0:7}"

        # ── Call the backend ──────────────────────────────────────────────────
        HTTP_RESPONSE=$(curl \
          --silent \
          --show-error \
          --max-time 120 \
          --retry 2 \
          --retry-delay 5 \
          --write-out "\n%{http_code}" \
          --request POST \
          --header "Content-Type: application/json" \
          --header "X-Actions-Secret: ${SHARED_SECRET}" \
          --header "X-GitHub-Token: ${GH_TOKEN}" \
          --data "{
            \"owner\": \"${OWNER}\",
            \"name\": \"${REPO_NAME}\",
            \"pr_number\": ${PR_NUMBER},
            \"commit_sha\": \"${COMMIT_SHA}\"
          }" \
          "${BACKEND_URL}/api/actions/analyze" 2>&1)

        HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -1)
        RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)

        echo "Backend response status: ${HTTP_STATUS}"

        # ── Handle error responses ────────────────────────────────────────────
        if [ "$HTTP_STATUS" -eq 401 ]; then
          echo "::error::Authentication failed. Check that shared-secret matches ACTIONS_SHARED_SECRET in the backend."
          exit 1
        fi

        if [ "$HTTP_STATUS" -eq 404 ]; then
          echo "::warning::Repository ${OWNER}/${REPO_NAME} has not been authorized in GitReview AI."
          echo "::warning::A user must authorize this repository via the GitReview AI extension first."
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$HTTP_STATUS" -ge 500 ]; then
          echo "::error::Backend error (HTTP ${HTTP_STATUS}). Analysis could not be completed."
          exit 1
        fi

        if [ "$HTTP_STATUS" -ne 200 ]; then
          echo "::error::Unexpected response (HTTP ${HTTP_STATUS}) from backend."
          exit 1
        fi

        # ── Extract result fields ─────────────────────────────────────────────
        COMMENT_BODY=$(echo "$RESPONSE_BODY" | python3 -c "
        import json, sys
        try:
            data = json.load(sys.stdin)
            print(data.get('comment_markdown', ''))
        except Exception as e:
            print(f'Error parsing response: {e}', file=sys.stderr)
            sys.exit(1)
        ")

        RISK_TIER=$(echo "$RESPONSE_BODY" | python3 -c "
        import json, sys
        try:
            data = json.load(sys.stdin)
            print(data.get('risk_tier', 'unknown'))
        except:
            print('unknown')
        ")

        STATUS=$(echo "$RESPONSE_BODY" | python3 -c "
        import json, sys
        try:
            data = json.load(sys.stdin)
            print(data.get('status', 'unknown'))
        except:
            print('unknown')
        ")

        echo "risk_tier=${RISK_TIER}" >> "$GITHUB_OUTPUT"
        echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

        # Write the comment body to a temp file
        echo "$COMMENT_BODY" > /tmp/gitreview_comment.md
        echo "comment_written=true" >> "$GITHUB_OUTPUT"

        echo "✅ Analysis complete: risk_tier=${RISK_TIER}, status=${STATUS}"

    # ── Post or update the PR comment ─────────────────────────────────────────
    - name: Post or update PR comment
      if: steps.analyze.outputs.comment_written == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          let commentBody;
          try {
            commentBody = fs.readFileSync('/tmp/gitreview_comment.md', 'utf8');
          } catch (e) {
            core.warning('Could not read comment file: ' + e.message);
            return;
          }

          if (!commentBody || commentBody.trim() === '') {
            core.warning('Empty comment body — skipping comment post.');
            return;
          }

          const MARKER = '<!-- gitreview-ai-bot -->';
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issue_number = context.issue.number;

          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          });

          const existing = comments.find(c => c.body && c.body.includes(MARKER));

          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body: commentBody,
            });
            console.log('Updated existing GitReview AI comment #' + existing.id);
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body: commentBody,
            });
            console.log('Created new GitReview AI comment.');
          }

    # ── Apply risk tier label ──────────────────────────────────────────────────
    - name: Apply risk tier label
      if: steps.analyze.outputs.risk_tier != '' && steps.analyze.outputs.risk_tier != 'unknown' && steps.analyze.outputs.status != 'skipped'
      uses: actions/github-script@v7
      with:
        script: |
          const riskTier = '${{ steps.analyze.outputs.risk_tier }}';
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issue_number = context.issue.number;

          const labelConfig = {
            'low':      { name: 'risk: low',      color: '0e8a16', description: 'GitReview AI: Low risk' },
            'medium':   { name: 'risk: medium',   color: 'fbca04', description: 'GitReview AI: Medium risk' },
            'high':     { name: 'risk: high',     color: 'e36209', description: 'GitReview AI: High risk' },
            'critical': { name: 'risk: critical', color: 'd73a4a', description: 'GitReview AI: Critical risk' },
          };

          const config = labelConfig[riskTier];
          if (!config) {
            console.log('Unknown risk tier: ' + riskTier + ' — skipping label.');
            return;
          }

          try {
            await github.rest.issues.getLabel({ owner, repo, name: config.name });
          } catch (e) {
            if (e.status === 404) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo,
                  name: config.name,
                  color: config.color,
                  description: config.description,
                });
                console.log('Created label: ' + config.name);
              } catch (createErr) {
                core.warning('Could not create label: ' + createErr.message);
              }
            }
          }

          const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
            owner, repo, issue_number,
          });
          const riskLabels = currentLabels.filter(l => l.name.startsWith('risk: '));
          for (const label of riskLabels) {
            try {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: label.name,
              });
            } catch (e) {
              core.warning('Could not remove label ' + label.name + ': ' + e.message);
            }
          }

          try {
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: [config.name],
            });
            console.log('Applied label: ' + config.name);
          } catch (e) {
            core.warning('Could not apply label ' + config.name + ': ' + e.message);
          }
